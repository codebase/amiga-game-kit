name: selftest
on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake python3
      - name: Cache emulator build
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('tools/setup', 'patches/*') }}
      - name: Setup (ACE, vAmiga, toolchain image)
        run: tools/setup
      # No Kickstart ROMs in CI: test on the free AROS profile.
      - name: Selftest
        run: tools/selftest a500-aros
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agk-artifacts
          path: |
            examples/*/build/agk
            examples/*/build/build.log
