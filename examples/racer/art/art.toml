# Game art, converted by agk (agk art / agk build). Reference: agk help-art
[art]
depth = 3                 # PF1 (in front of the road): dashboard, scenery later

[car]
# Retro Diffusion (art/ai/car_raw.png), 48x32; frames: straight, left, right
# (the top leans into the turn, made from the original by a small skew)
source = "car.png"
kind = "sprite"
attached = true           # 15 colours: 3 attached pairs = channels 0-5
channel = 0
frame_width = 48

[backdrop]
# The horizon strip behind the road: drawn by art/tools/backdrop.py, copied
# into the road bitmap (main.c) and shown above the road's top line
source = "backdrop.txt"
kind = "bitmap"
depth = 3
palette = "road_palette.txt"   # the road's own colour indices
wrap_x = 512                   # 512 + 512 = the road bitmap's 1024 px

[palm]
# Retro Diffusion (art/ai/palm_raw.png) in 10 sizes by art/tools/scale_sheet.py
# (the sizes are in src/gen_palm.h); drawn with the blitter into playfield 1
source = "palm_sheet.png"
kind = "bob"
