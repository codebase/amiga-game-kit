# Game art, converted by agk (agk art / agk build). Reference: agk help-art
[art]
depth = 2                 # bitplanes of the display (BOBs use this)

[mountains]
source = "mountains.png"
kind = "bitmap"
depth = 3
palette = "auto"
wrap_x = 320

[hills]
source = "hills.png"
kind = "bitmap"
depth = 3
palette = "auto"
wrap_x = 320

[tiles]
source = "tiles.txt"      # 16x16 level tiles for PF1, stacked vertically
kind = "bitmap"
depth = 3
palette = "auto"          # own palette -> colours 1-7 of the front playfield

[hero]                    # 32x32, 15 colours: two attached sprite pairs (channels 0-3)
source = "hero.txt"       # AI base (hero.png) animated by hand as text art
kind = "sprite"
attached = true
channel = 0
mirror = true             # + left-facing copies of every frame
